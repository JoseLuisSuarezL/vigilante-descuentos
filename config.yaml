    por_pagina: 120
    paginas_por_vez: 8
    paginas_max: 40

  # EL GANSO · Rebajas y precios especiales de hombre. Tiene un cortafuegos
  # que exige navegador; si en la prueba sale "BLOQUEADA", no se puede leer.
  - nombre: El Ganso
    grupo: Moda Tendam
    auto: https://www.elganso.com/es/
    filtro_secciones: "hombre|zapatillas"
    navegador: true
    urls:
