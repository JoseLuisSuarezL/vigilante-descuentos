# ============================================================
#  CONFIGURACIÓN DEL VIGILANTE DE DESCUENTOS
#  Solo CAMISETAS DE FÚTBOL de las tiendas oficiales de los clubes.
#  Puedes editar este archivo directamente en GitHub (icono del lápiz).
# ============================================================

# Te avisa de camisetas rebajadas este porcentaje o más
descuento_minimo: 60

# Máximo de ofertas por aviso y tienda (las demás llegan en el siguiente)
max_avisos_por_ejecucion: 15

# La primera vez que se revisa una tienda, si ya tiene muchas ofertas, te
# manda UN resumen (las 5 mejores) en vez de decenas de mensajes.
resumen_primera_vez: true

# Minutos que puede durar cada tarea de GitHub (el límite de GitHub es 25).
# Si no da tiempo a todo, lo que falte se revisa en la siguiente vuelta.
minutos_max_por_tarea: 19

# FILTRO DE CAMISETAS Y TALLAS
# Solo te avisa de CAMISETAS DE FÚTBOL de hombre adulto (camiseta, jersey,
# shirt, maillot, trikot, camisola, maglia…) que queden disponibles en talla
# XL o mayor (XL, XXL, 3XL…). Descarta camisetas de mujer y de niño,
# camisetas de algodón/casuales, polos, sudaderas, pantalones, gorras,
# bufandas, tazas, minicamisetas, cuadros…
tallas:
  activo: true
  solo_camisetas: true
  # Si no se pueden ver las tallas de un artículo: descartar | avisar
  si_no_se_sabe: descartar

tiendas:

  # SEVILLA FC · Catálogo completo de la tienda oficial (≈1.400 artículos)
  # + colecciones de ofertas.
  - nombre: Sevilla FC
    grupo: LaLiga 1
    shopify: https://shop.sevillafc.es
    colecciones:
      - outlet
      - ultimas-unidades-25-26
      - descuentos-en-productos-seleccionados
      - promociones


