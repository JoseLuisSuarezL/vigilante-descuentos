  # ---------- AMAZON ----------
  # DESACTIVADO: Amazon bloquea las visitas desde GitHub (error 503). Usa Keepa.
  # Búsqueda con el filtro de Amazon "60 % de descuento o más" + "vendido por
  # Amazon" (sin vendedores externos, que inflan el precio recomendado). El
  # descuento real se calcula con el precio tachado y se descartan anuncios.
  # Amazon puede bloquear las visitas desde GitHub: si sale "BLOQUEADA",
  # usa Keepa (keepa.com) para Amazon.
  - nombre: Amazon · Hombre
    activa: false   # bloquea las visitas automáticas; pon true para probar otra vez
    grupo: Amazon
    paginadas:
      - "https://www.amazon.es/s?i=fashion-mens&rh=p_8%3A60-99%2Cp_6%3AA1AT7YVPFBWXBL&page={n}"
    paginas_por_vez: 4
    paginas_max: 20
  - nombre: Amazon · Bebé
