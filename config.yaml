# ============================================================
#  CONFIGURACIÓN DEL VIGILANTE DE DESCUENTOS
#  Puedes editar este archivo directamente en GitHub (icono del lápiz).
#  Lo más habitual es cambiar solo "descuento_minimo".
# ============================================================

# Te avisa de artículos rebajados este porcentaje o más
descuento_minimo: 60

# Máximo de ofertas por aviso y tienda (las demás llegan en el siguiente)
max_avisos_por_ejecucion: 15

# La primera vez que se revisa una tienda, si ya tiene muchas ofertas, te
# manda UN resumen (las 5 mejores) en vez de decenas de mensajes.
resumen_primera_vez: true

# Cada tienda se revisa en paralelo y por separado, cada 15 minutos.
# Las formas de leer cada web se han elegido tras analizarlas una a una.

tiendas:

  # ZARA · Catálogo completo de HOMBRE (≈3.000 artículos, una sola consulta)
  # + secciones de ofertas (Special Prices, Rebajas, Black Friday…), que se
  # detectan solas en cada temporada.
  - nombre: Zara
    zara:
      web: https://www.zara.com
      ruta: es/es
      seccion: HOMBRE

  # FIFTY · Todo hombre (≈3.400 artículos), leído en bloques de 120.
  - nombre: Fifty
    paginadas:
      - https://fiftyoutlet.com/on/demandware.store/Sites-FF-Site/es_ES/Search-UpdateGrid?cgid=man&pmin=0%2c01&start={inicio}&sz=120
    por_pagina: 120
    paginas_max: 60

  # PCCOMPONENTES · Ofertas TOP y Últimas unidades ordenadas por descuento
  # (en cada vuelta) + las 520 categorías de la tienda, ordenadas por
  # descuento, por turnos (vuelta completa cada hora y media aprox.).
  - nombre: PcComponentes
    paginadas:
      - https://www.pccomponentes.com/campanas/ofertas-especiales?sort=discount&page={n}
      - https://www.pccomponentes.com/campanas/ultimas-unidades?sort=discount&page={n}
    ordenado_por_descuento: true
    paginas_max: 60
    categorias:
      sitemap: https://www.pccomponentes.com/sitemap/sitemap_categories.xml
      patron: "/categorias/[^/]+$"
      sufijo: "?sort=discount&page={n}"
      por_vez: 90

  # LEFTIES · Catálogo de HOMBRE (≈4.000 artículos). Las secciones de
  # ofertas (Promoción, Rebajas…) se revisan enteras siempre; el resto del
  # catálogo, por turnos de 250 artículos.
  - nombre: Lefties
    inditex:
      web: https://www.lefties.com
      store: 94009000
      catalogo: 90009053
      seccion: hombre
      por_vez: 250

  # SEVILLA FC · Catálogo completo de la tienda oficial (≈1.400 artículos)
  # + colecciones de ofertas.
  - nombre: Sevilla FC
    shopify: https://shop.sevillafc.es
    colecciones:
      - outlet
      - ultimas-unidades-25-26
      - descuentos-en-productos-seleccionados
      - promociones

  # SILBON · Todo hombre (ropa, calzado, complementos) + rebajas, outlet y
  # Black Friday de hombre (se llenan en temporada).
  - nombre: Silbon
    shopify: https://www.silbonshop.com
    solo_colecciones: true
    colecciones:
      - ver-todo-ropa-hombre
      - todo-calzado-hombre
      - todo-complementos-hombre
      - rebajas-ver-todo-hombre
      - segundas-rebajas-hasta50-hombre
      - black-friday-ver-todo-hombre

  # SCALPERS · Todo hombre (≈2.500 artículos) + rebajas, outlet, flash sale,
  # mid season sale, últimas unidades y marcas invitadas de hombre.
  - nombre: Scalpers
    shopify: https://scalperscompany.com
    solo_colecciones: true
    colecciones:
      - hombre-todo-1131
      - hombre-rebajas-1501
      - hombre-rebajas-hasta-70-1524
      - hombre-ultimas-unidades-1599
      - hombre-flash-sale-1600
      - hombre-mid-season-sale-1573
      - invited-brands-hombre-rebajas-ver-todo-5622
      - invited-brands-hombre-the-outlet-5526
      - invited-brands-hombre-outlet-5592
      - invited-brands-hombre-nueva-coleccion-ropa-ver-todo-5012
      - invited-brands-hombre-nueva-coleccion-calzado-ver-todo-5007
      - invited-brands-hombre-nueva-coleccion-accesorios-ver-todo-5002


  # ---------- MÁS MODA HOMBRE ----------
  # MASSIMO DUTTI · Catálogo de hombre (API de Inditex). Las secciones de
  # ofertas (Special Prices, Rebajas…) se revisan enteras siempre; el resto,
  # por turnos.
  - nombre: Massimo Dutti
    grupo: Moda Inditex
    inditex:
      web: https://www.massimodutti.com
      store: 34009450
      catalogo: 30359536
      seccion: hombre
      por_vez: 150

  # PULL&BEAR · Igual que Massimo Dutti. Sus fichas pesan mucho, así que el
  # catálogo completo va por turnos pequeños.
  - nombre: Pull&Bear
    activa: false   # bloquea las visitas automáticas; pon true para probar otra vez
    grupo: Moda Inditex
    inditex:
      web: https://www.pullandbear.com
      store: 24009400
      catalogo: 20309459
      seccion: hombre
      por_vez: 40
      patron_ofertas: "promo|rebaj|oferta|special|sale|black|outlet|liquid"

  # SPRINGFIELD y PEDRO DEL HIERRO · Mismo sistema que Fifty: todo hombre por
  # bloques de 120 (por turnos) + secciones de ofertas de hombre de la portada.
  - nombre: Springfield
    grupo: Moda Tendam
    auto: https://myspringfield.com/es/es/hombre
    filtro_secciones: "/hombre/"
    navegador: false
    paginadas:
      - https://myspringfield.com/on/demandware.store/Sites-SPF-Site/es_ES/Search-UpdateGrid?cgid=men&pmin=0%2c01&start={inicio}&sz=120
    por_pagina: 120
    paginas_por_vez: 10
    paginas_max: 80
  - nombre: Pedro del Hierro
    grupo: Moda Tendam
    auto: https://pedrodelhierro.com/es/es/hombre
    filtro_secciones: "/hombre/"
    navegador: false
    paginadas:
