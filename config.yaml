  # páginas en cada vuelta: Descuentos TOP se completa en menos de una hora
  # y los departamentos enteros, en unas horas.
  - nombre: El Corte Inglés · Hombre
    activa: false   # bloquea las visitas automáticas; pon true para probar otra vez
    grupo: El Corte Inglés
    paginadas:
